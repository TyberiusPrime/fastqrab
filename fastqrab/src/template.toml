# === Other tag manipulations ===

# ==== ConcatTags ====
## Concatenate multiple tags into a single tag
## Works with location tags (e.g., from ExtractIUPAC) and string tags
## - Location tags: appends all regions/hits from all input tags
## - String tags: concatenates strings with optional separator
## - Mixed types: converts all to strings and concatenates
# [[step]]
#    action = "ConcatTags"
#    in_labels = ["mytag", "mytag2"]  # list of tags to concatenate (minimum 2)
#    out_label = "combined"  # output tag name
#    on_missing = "merge_present"  # required: how to handle missing tags
#                                  # "merge_present": skip missing tags, merge only present ones
#                                  # "set_missing": set output to missing if any input is missing
#    separator = "_"  # (optional) separator for string concatenation, defaults to no separator
#
# # Example: Combine two barcode extractions
# [[step]]
#    action = "ExtractIUPAC"
#    segment = "read1"
#    search = "AAAA"
#    out_label = "barcode1"
#    anchor = "Left"
#    max_mismatches = 0
#
# [[step]]
#    action = "ExtractIUPAC"
#    segment = "read1"
#    search = "TTTT"
#    out_label = "barcode2"
#    anchor = "Right"
#    max_mismatches = 0
#
# [[step]]
#    action = "ConcatTags"
#    in_labels = ["barcode1", "barcode2"]
#    out_label = "combined_barcode"
#    on_missing = "merge_present"
#
# # If input is "AAAACGTACGTTTT", combined_barcode will display as "AAAA_TTTT"
# # when used with StoreTagInComment or similar steps.

# ==== ForgetAllTags ====
## forget about every tag currently stored
## useful when downstream steps should not see previous tags
# [[step]]
#    action = "ForgetAllTags"

# ==== FillMissing ====
## Use the primary tag if it is not missing, otherwise use the secondary tag.
## Both tags must be Location or String; a Location+String mixture outputs String.
# [[step]]
#    action = "FillMissing"
#    in_label_primary = "mytag"    # (alias: primary, first) tag used when not missing
#    in_label_secondary = "mytag2" # (alias: secondary, second) tag used as fallback
#    out_label = "result"          # output tag name

# ==== PickTag ====
## Pick one value out of several tags per read, according to a policy.
## Every tag in in_labels must have the same type (Location, String or Numeric; Bool is not supported).
# [[step]]
#    action = "PickTag"
#    in_labels = ["mytag", "mytag2"] # tags to choose between, all the same type
#    out_label = "result"            # output tag name
#    policy = "first_available"      # "first_available" | "equal_only" | "largest" | "smallest" | "left_most_region"
#
# # policy behavior:
# # - first_available: the left-most tag (in in_labels) that has a value.
# #   Location, String or Numeric only (Numeric uses NaN as "missing").
# # - equal_only: a value, but only if every input tag agrees; else missing.
# #   Location/String compare their text; Numeric disagreement outputs NaN.
# # - largest: Location or Numeric only. The tag with the largest measure -
# #   region length sum for Location tags, or the value itself for Numeric tags.
# # - smallest: the inverse of largest - the tag with the smallest measure.
# # - left_most_region: Location tags only. The tag whose first region starts
# #   earliest, comparing (segment, start) - so this also picks between tags
# #   living on different segments.
#
# # Example: prefer a barcode found at the start of read1, falling back to one
# # found anywhere in read2.
# [[step]]
#    action = "ExtractIUPAC"
#    segment = "read1"
#    search = "AAAA"
#    out_label = "barcode1"
#    anchor = "Left"
#    max_mismatches = 0
#
# [[step]]
#    action = "ExtractIUPAC"
#    segment = "read2"
#    search = "TTTT"
#    out_label = "barcode2"
#    anchor = "Anywhere"
#    max_mismatches = 0
#
# [[step]]
#    action = "PickTag"
#    in_labels = ["barcode1", "barcode2"]
#    out_label = "barcode"
#    policy = "first_available"

# ==== ForgetTag ====
## forget about a tag
## usefull if you want to store tags in a table,
## but not this one
# [[step]]
#    action = "ForgetTag"
#    in_label = "mytag"



# == Filters ==

# Most filters come with a keep_or_remove option,
# that decides whether you keep reads that match the filter,
# or whether you keep those that don't match (= remove those that match).

# === Tag filters ===

# ==== FilterByTag ====
## Remove sequences that have (or don't have) a 'region' tag
# [[step]]
#    action = "FilterByTag"
#    in_label = "mytag"
#    keep_or_remove = "Keep" # or "Remove"


# ==== FilterByNumericTag ====
## Remove sequences that have (or don't have) a tag
# [[step]]
#    action = "FilterByNumericTag"
#    in_label = "mytag"
#    keep_or_remove = "Keep" # or "Remove"
#    min_value = 0.0 # (optional) minimum value (inclusive)
#    max_value = 10.0 # (optional) maximum value (exclusive)
## Note: You can filter either min, max, or both, but one of them must be set.


# === Read 'number' based filters ===

# ==== Head ====
## Keep only the first N reads
# [[step]]
#    action = "Head"
#    n = 1000 # number of reads to keep

# ==== Skip ====
## Skip the first N reads
# [[step]]
#    action = "Skip"
#    n = 100 # number of reads to skip

# ==== FilterSample ====
## Randomly sample a subset of reads
# [[step]]
#    action = "FilterSample"
#    p = 0.1 # probability to keep any read (0..1)
#    seed = 42 # (optional) random seed for reproducibility


# ==== FilterReservoirSample ====
# [[step]]
# action = "FilterReservoirSample"
# n = 10_000
# seed = 59

## Filter for a fixed number of reads based on [reservoir sampling](https://en.wikipedia.org/wiki/Reservoir_sampling), that is all reads have an equal probability of being selected.



# ==== FilterEmpty ====
## Remove reads that are empty (zero length)
# [[step]]
#    action = "FilterEmpty"
#    segment = "All" # Any of your input segments, or 'All'

## On segment='All', only filters reads that are empty in all parts.
## Use multiple FilterEmpty to filter if any part is empty.
## Note: FilterEmpty is a convenience wrapper around CalcLength + FilterByNumericTag(min=1)

