#    segment = "read1" # Any of your input segments, or 'All'
#
# # Filter based on the complexity score
# [[step]]
#    action = "FilterByNumericTag"
#    in_label = "complexity"
#    min_value = 0.3  # minimum complexity score (0-1)
#    keep_or_remove = "Keep"




# == Edits ==

# ==== ReplaceTagWithLetter ====
## Replace sequence bases in tagged regions with a specified letter
## Useful for example to mask low-quality regions as 'N'
# [[step]]
#    action = "ReplaceTagWithLetter"
#    in_label = "mytag"  # Tag containing regions to replace
#    letter = "N"  # Replacement character (defaults to 'N')

# ==== StoreTagBackInSequence ====
## Store the tag's replacement in the sequence,
## replacing the original sequence at that location.
# [[step]]
#    action = "StoreTagBackInSequence"
#    in_label = "mytag"
#    on_lost = "complain"    # or "Complain": what to do when the tag's location was
#                          # cut away by an edit applied after it was captured.
#                          # Ignore leaves the read unchanged; Complain errors.


# ==== StoreTagInSequence ====
## Insert a tag's string value into a read sequence at the position defined by another
## location tag.
## in_value_label must be a location or string tag (its sequence is inserted).
## in_position_label must be a location tag (it defines where to insert).
## anchor = "Start" / "left"  → insert before the leftmost position of in_position_label.
## anchor = "End"   / "right" → insert after the rightmost end of in_position_label.
## Quality scores for inserted bases are set to '~' (maximum Sanger quality).
# [[step]]
#    action = "StoreTagInSequence"
#    in_value_label = "mytag"      # location or string tag to insert
#    in_position_label = "mytag2"  # location tag defining the insert position
#    anchor = "Start"              # or "End" / "left" / "right"
#    on_lost = "complain"           # or "Ignore": what to do when the position
#                                  # tag's location was cut away by a later edit.
#                                  # Ignore ) leaves the read unchanged.


# ==== StoreTagInComment ====

## Store currently present tags as comments on read names.
## Comments are key=value pairs, separated by `comment_separator`
## which defaults to '|'.
## They get inserted at the first `comment_insert_char`,
## which defaults to space. The comment_insert_char basically moves
## to the right.
##
## That means a read name like
## @ERR12828869.501 A00627:18:HGV7TDSXX:3:1101:10502:5274/1
## becomes
## @ERR12828869.501|key=value|key2=value2 A00627:18:HGV7TDSXX:3:1101:10502:5274/1
##
## This way, your added tags will survive STAR alignment.
## (STAR always cuts at the first space, and by default also on /)
##
## (If the comment_insert_char is not present, we simply add at the right)
##
##
## Be default, comments are only placed on read1.
## If you need them somewhere else, or an all reads, change the segment (to "All")
# [[step]]
#    action = "StoreTagInComment"
#    in_labels = ["mytag"] # store these tags (may also be a string for one tag. Alias: 'in_label'
#    segment = "read1" # Any of your input segments, or 'All'
#    comment_insert_char = ' ' # (optional) char at which to insert comments
#    comment_separator = '|' # (optional) char to separate comments
#    region_separator = '_' # (optional) char to separate regions in a tag, if it has multiple


# ==== HammingCorrect ====
## Correct a tag to one of a predefined set of 'barcodes' using closest hamming distance.
#
# [[step]]
#    action = "HammingCorrect"
#    in_label = "mytag"
#    out_label = "my_corrected_tag"
#    output = 'barcodes' # barcode | label
#    barcodes = "mybarcodelist"
#    max_hamming_distance = 1
#    on_no_match = "remove" # 'remove', 'empty', 'keep'
#    on_tie = "remove" # 'remove', 'empty', 'keep', 'first', 'first_strict', 'fail', 'by_majority', 'by_edit_probability'
#    name_split_character = '|' # optional, see full docs
##    Further options for by_majority and by_edit_probability
##    on_tie_threshold = 0.975 # optional, default 0.975. Adjusted frequency: (n+1) / (N+k)
##    on_tie_min_molecules_to_start = 1_000_000 # optional, default 1_000_000. See below
##    on_tie_use_counts_from_report = { # optional, read counts from previous report, see full docs
##           file_name = "report.json",
##           report_name = "barcodes",
##           tag_name = "whitelisted"
##    }

#
#[barcodes.mybarcodelist]
#    "AAAA" = "ignored" # only read when demultiplexing

## on_no_match controls what happens if the tag cannot be corrected within the max_hamming_distance:
##
## * remove: Remove the hit (location and sequence), useful for FilterByTag later.
## * keep: Keep the original tag (and location)
## * empty: Keep the original location, but set the tag to empty.

## on_tie controls what happens with ties:
## * remove: Remove the hit (location and sequence), useful for FilterByTag later.
## * keep: Keep the original tag (and location)
## * empty: Keep the original location, but set the tag to empty.
## first: just use the alphabetically first barcode
## first_strict: use the alphabetically first barcode, but only if they labels (or their prefixes up to name_split_character) of all tied barcodes matches.
## fail: complain and end the run
## by_majority: Correct towards predominant barcodes (see full documentation)


