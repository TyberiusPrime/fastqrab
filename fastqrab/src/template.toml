## Check if a tag matches one these values 

#[[step]]
#  action  = 'Matches'
#  out_label = 'of_interest'
#  source = 'name:read1' # or tag:<tag_label> or <segment>
#  accepted = ['alpha1', 'beta1', 'nosuch']

