# ==== CalcQualifiedBases ====
## Count number of high-quality bases
# [[step]]
#    action = "CalcQualifiedBases"
#    threshold = 'C' # minimum quality score for a base to be considered qualified
#    op = 'below' # Do we count phred scores better (below) or worse (above) than the threshold?
#    segment = "read1" # Any of your input segments, or 'All'
#    out_label = "tag_name"
#    relative = false # whether to output counts (false) or a rate (true)

## op also takes the values
## * worse / above / > / gt
## * worse_or_equal / above_or_equal / >= / gte
## * better / below / < / lt
## * better_or_equal / below_or_equal / <= / lte

# ==== EvalExpression ====
## Calculate a numeric expression based on existing numeric tags

# [[step]]
#	action = "EvalExpression"
#   expression = '''
#             mytag>= 50
#   '''
#   out_label = "outtag"
#   out_type = "numeric" # or 'boolean', optional

## Besides the regular arithmetic operators (+, -, *, /, %, ^) this supports
## boolean operations (>, <, >=, <=, ==, !=) and the following functions are
## supported: log(base, val), e(), pi(), int(), ceil(), floor(), round(), abs(),
## sign(), min(a,b,...), max(a,b,...) sin(radians), cos(radians), tan(radians),
## sinh(radians), cosh(radians), tanh(radians), 

## You can also use len_<segment> or len_<tagname> to access the length of tags and segments,
## and 'read_no' to access a reads index in the file.

