name: Test Workflow
env:
  # The project name specified in your Cargo.toml
  PROJECT_NAME: fastqrab
  GITHUB_ACTIONS: true

on:
  push:
    branches:
      - '**'

jobs:
  checks:
    # permissions:
    #   contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31.10.6
      - name: Test
        run: nix build -L .#test


