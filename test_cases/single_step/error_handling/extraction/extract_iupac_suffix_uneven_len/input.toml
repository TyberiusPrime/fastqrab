[input]
    read1 = 'sample_data/ten_reads.fq'
[[step]]
    action = 'ExtractIUPACSuffix'
	out_label = "label"
    query = ['AAA','GNNN', 'GCT']
    min_length = 2
    max_mismatches = 3

[[step]]
  action = 'forgetalltags'

[output]
    prefix = "output"

# --- Output steps (migrated from [output]) ---
[[step]]
    action = "OutputFASTQ"
