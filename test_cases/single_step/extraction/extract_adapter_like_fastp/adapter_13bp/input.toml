# expected output generated by fastp 1.4.0 via
# dev/scripts/generate_fastp_adapter_test_cases.py
# fastp -i input_read1.fq -o output_read1.fq -a AGATCGGAAGAGC -Q -L -G --dimer_max_len -1 -w 1
[input]
    read1 = 'input_read1.fq'

[[step]]
    action = 'ExtractAdapterLikeFastP'
    out_label = 'adapter'
    adapter = 'AGATCGGAAGAGC'

[[step]]
    action = 'TrimAtTag'
    in_label = 'adapter'
    direction = 'End'
    keep_tag = false

# fastp drops reads that are empty after trimming
[[step]]
    action = 'FilterEmpty'
    segment = 'read1'

[output]
    prefix = 'output'

[[step]]
    action = 'OutputFASTQ'
