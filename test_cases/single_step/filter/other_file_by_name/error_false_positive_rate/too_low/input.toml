[input]
read1 = "input_read1.fq"

[output]
    prefix = "output"
[[step]]
action = "TagOtherFile"
source = "name:read1"
other_read_name_end_char = false
false_positive_rate = -0.000001
filename = "other_read1.fq"
out_label = "tag"
seed = 42

[[step]]
action = "FilterByTag"
in_label = "tag"
keep_or_remove = "Remove"

# --- Output steps (migrated from [output]) ---
[[step]]
    action = "OutputFASTQ"
    compression = "zst"
