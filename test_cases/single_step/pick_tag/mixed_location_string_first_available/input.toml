[input]
    read1 = 'input_read1.fq'

# Location tag: only read1 has AAAA at the start
[[step]]
    action = 'ExtractIUPAC'
    search = 'AAAA'
    out_label = 'loc_tag'
    anchor = 'Left'
    max_mismatches = 0

# String tag: extract 'read' from the read name (always present)
[[step]]
    action = 'ExtractRegex'
    search = 'read\d{2,}'
    out_label = 'str_tag'
    source = 'name:read1'

# 'first_available' accepts Location and String individually, but PickTag
# still requires every input tag to share the same type - so mixing the two
# is rejected here.
[[step]]
    action = 'PickTag'
    in_labels = ['loc_tag', 'str_tag']
    out_label = 'result'
    policy = 'first_available'

[[step]]
    action = 'StoreTagInComment'
    in_label = 'result'

[output]
    prefix = "output"

# --- Output steps (migrated from [output]) ---
[[step]]
    action = "OutputFASTQ"
